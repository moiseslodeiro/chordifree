services:
  extractor:
    build:
      context: .
    image: chordifree-youtube-extractor:local
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:8010:8010"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
