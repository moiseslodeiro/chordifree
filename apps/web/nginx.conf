server {
    listen 80;
    server_tokens off;
    include /etc/nginx/security-headers.conf;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El frontend llama a rutas relativas /api; nginx las reenvía al servicio
    # Express para que el navegador vea un único origen.
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        client_max_body_size 30m;
    }

    # Los assets llevan hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El índice no se cachea para que un despliegue nuevo se vea al recargar.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
