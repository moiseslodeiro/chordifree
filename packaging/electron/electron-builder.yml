appId: app.chordifree.desktop
productName: Chordifree
copyright: Copyright © Chordifree contributors

directories:
  output: release

files:
  - main.cjs
  - preload.cjs
  - update-check.cjs
  - package.json

extraResources:
  - from: resources
    to: .

mac:
  target:
    - dmg
    - zip
  category: public.app-category.music
  icon: assets/icon.icns
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  signIgnore:
    - 'Contents/Resources/analyzer'
  artifactName: chordifree-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  icon: assets/icon.png
  executableName: chordifree
  syncDesktopName: true
  artifactName: chordifree-${version}-${arch}.${ext}
  synopsis: Local-first chord practice
  description: Turn YouTube videos or your own audio into synchronized chord sheets.
  maintainer: Chordifree contributors

win:
  executableName: Chordifree
  icon: assets/icon.ico
  target:
    - nsis
  artifactName: chordifree-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
