appId: app.chordifree.desktop
productName: Chordifree
copyright: Copyright © Chordifree contributors

directories:
  output: release

files:
  - main.cjs
  - preload.cjs
  - package.json

extraResources:
  - from: resources
    to: .

mac:
  target:
    - dmg
    - zip
  category: public.app-category.music
  icon: assets/icon.icns
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: chordifree-${version}-${arch}.${ext}

win:
  executableName: Chordifree
  icon: assets/icon.ico
  target:
    - nsis
  artifactName: chordifree-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
