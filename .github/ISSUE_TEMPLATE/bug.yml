name: Bug report
description: Something does not work as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Do not include tokens, personal data or copyrighted audio.
        For security issues, use the private process in SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: git commit SHA or tag
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options:
        - Docker Compose
        - Local development
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove paths, tokens and personal data before pasting.
      render: shell
