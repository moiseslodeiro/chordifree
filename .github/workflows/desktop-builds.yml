name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  essentia-wheel:
    name: Build Essentia Windows wheel
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VCPKG_DEFAULT_BINARY_CACHE: C:/vcpkg-cache
      VCPKG_BUILD_TYPE: release
    steps:
      # Our repository is checked out at the workspace root so the patch script
      # and the test fixture are available; Essentia lives in essentia-src.
      - name: Checkout Chordifree
        uses: actions/checkout@v4

      - name: Checkout the Essentia Windows PR
        uses: actions/checkout@v4
        with:
          repository: MTG/essentia
          ref: refs/pull/1514/head
          path: essentia-src
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply the Essentia build patches
        run: python packaging/analyzer/patch_essentia.py essentia-src

      - name: Check the resolved version
        working-directory: essentia-src
        shell: bash
        run: |
          git describe --always --tags
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          version = Path("VERSION").read_text(encoding="utf-8").strip()
          describe = subprocess.run(
              ["git", "describe", "--always", "--tags"],
              capture_output=True, text=True, check=False,
          ).stdout.strip()
          match = re.search(r"-(\d+)-g[0-9a-f]+$", describe)
          dev = match.group(1) if match else "0 (fallback)"
          print(f"VERSION={version} describe={describe} dev_commits={dev}")
          if version.endswith("-dev") and not match:
              print("::warning::No tag ancestor found; the wheel will use dev0")
          PY

      - name: Prepare the vcpkg binary cache
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-v1-${{ hashFiles('essentia-src/cibuildwheel.toml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-v1-

      - name: Install cibuildwheel
        run: python -m pip install 'cibuildwheel==3.2.1'

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build the Windows wheel
        working-directory: essentia-src
        shell: bash
        env:
          CIBW_BUILD: cp311-win_amd64
          CIBW_ARCHS: AMD64
        # cibuildwheel only auto-discovers pyproject.toml, so point it at the
        # Windows configuration that ships with the PR (vcpkg deps + env vars).
        run: python -m cibuildwheel --platform windows --config-file cibuildwheel.toml --output-dir wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: essentia-windows-wheel
          path: essentia-src/wheelhouse/*.whl
          if-no-files-found: error

  analyzer-sidecar:
    name: Freeze and smoke-test the analyzer
    needs: essentia-wheel
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/download-artifact@v4
        with:
          name: essentia-windows-wheel
          path: wheelhouse

      - name: Install Essentia wheel and sidecar dependencies
        shell: bash
        run: |
          python -m pip install wheelhouse/*.whl
          python -m pip install -r packaging/analyzer/requirements.txt pyinstaller

      - name: Download ONNX models
        shell: bash
        run: |
          mkdir -p services/analyzer/models
          curl -fsSL 'https://huggingface.co/jafet21/yamnetonnx/resolve/337f563004630f00673d4a773a0d657d0233ce56/yamnet.onnx' \
            -o services/analyzer/models/yamnet.onnx
          curl -fsSL 'https://essentia.upf.edu/models/classification-heads/voice_instrumental/voice_instrumental-audioset-yamnet-1.onnx' \
            -o services/analyzer/models/voice_instrumental.onnx
          echo '04e27fca08e7a3aea2630d1a63a51e6b437c803e0ff6e26399f80870ac251dda  services/analyzer/models/yamnet.onnx' | sha256sum -c -
          echo 'f619b35a95a44d8c3ec27a205d4c93ec988401fca443ff552ed007b3f1c018a0  services/analyzer/models/voice_instrumental.onnx' | sha256sum -c -

      - name: Build the sidecar
        run: pyinstaller packaging/analyzer/analyzer.spec --noconfirm

      - name: Smoke-test the sidecar
        shell: bash
        run: |
          ANALYZER_PORT=8123 ./dist/analyzer/analyzer.exe > analyzer.log 2>&1 &
          for i in $(seq 1 30); do
            sleep 2
            if curl -fsS http://127.0.0.1:8123/health; then break; fi
          done
          curl -fsS -X POST http://127.0.0.1:8123/analyze \
            -F "file=@scripts/fixtures/chords.wav" -o result.json
          python - <<'PY'
          import json
          data = json.load(open("result.json", encoding="utf-8"))
          labels = {segment["label"] for segment in data["segments"] if segment.get("label")}
          assert {"C", "F", "G"} <= labels, labels
          print("sidecar labels:", sorted(labels))
          PY
          taskkill //F //IM analyzer.exe || true

      - uses: actions/upload-artifact@v4
        with:
          name: chordifree-analyzer-windows
          path: dist/analyzer
          if-no-files-found: error

  windows-installer:
    name: Build the Windows installer
    needs: analyzer-sidecar
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Download the frozen analyzer
        uses: actions/download-artifact@v4
        with:
          name: chordifree-analyzer-windows
          path: dist/analyzer

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --filter @chordifree/web build

      - name: Install desktop dependencies
        working-directory: packaging/electron
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Bundle the server and stage the resources
        working-directory: packaging/electron
        run: |
          pnpm build:server
          pnpm resources

      - name: Build the NSIS installer
        working-directory: packaging/electron
        run: pnpm exec electron-builder --win nsis --publish never

      - name: Smoke-test the packaged app
        working-directory: packaging/electron
        shell: pwsh
        env:
          CHORDIFREE_SMOKE_LOG: ${{ github.workspace }}\desktop-smoke.log
          CHORDIFREE_SMOKE_FIXTURE: ${{ github.workspace }}\scripts\fixtures\chords.wav
        run: |
          $process = Start-Process -FilePath "release\win-unpacked\Chordifree.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if (Test-Path $env:CHORDIFREE_SMOKE_LOG) { Get-Content $env:CHORDIFREE_SMOKE_LOG }
          exit $process.ExitCode

      - name: Upload the desktop smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chordifree-desktop-smoke-log
          path: desktop-smoke.log
          if-no-files-found: ignore

      - name: Write the SHA-256 checksums
        working-directory: packaging/electron
        shell: bash
        run: |
          cd release
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          {
            echo '### Windows installer'
            echo ''
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo ''
            echo 'Unsigned preview. SmartScreen: **More info → Run anyway**.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chordifree-windows-installer
          path: |
            packaging/electron/release/*.exe
            packaging/electron/release/SHA256SUMS.txt
          if-no-files-found: error

  macos-installer:
    name: Build the macOS installer (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            artifact: chordifree-macos-arm64
          - os: macos-15-intel
            arch: x64
            artifact: chordifree-macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/analyzer/requirements.txt pyinstaller

      - name: Download ONNX models
        shell: bash
        run: |
          mkdir -p services/analyzer/models
          curl -fsSL 'https://huggingface.co/jafet21/yamnetonnx/resolve/337f563004630f00673d4a773a0d657d0233ce56/yamnet.onnx'             -o services/analyzer/models/yamnet.onnx
          curl -fsSL 'https://essentia.upf.edu/models/classification-heads/voice_instrumental/voice_instrumental-audioset-yamnet-1.onnx'             -o services/analyzer/models/voice_instrumental.onnx
          echo '04e27fca08e7a3aea2630d1a63a51e6b437c803e0ff6e26399f80870ac251dda  services/analyzer/models/yamnet.onnx' | shasum -a 256 -c -
          echo 'f619b35a95a44d8c3ec27a205d4c93ec988401fca443ff552ed007b3f1c018a0  services/analyzer/models/voice_instrumental.onnx' | shasum -a 256 -c -

      - name: Build the analyzer sidecar
        run: pyinstaller packaging/analyzer/analyzer.spec --noconfirm

      - name: Ad-hoc sign the analyzer
        run: |
          find dist/analyzer -type f \( -name '*.dylib' -o -name '*.so' \) -exec codesign --force --sign - {} \;
          codesign --force --sign - dist/analyzer/analyzer

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --filter @chordifree/web build

      - name: Install desktop dependencies
        working-directory: packaging/electron
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Bundle the server and stage the resources
        working-directory: packaging/electron
        run: |
          pnpm build:server
          pnpm resources

      - name: Ad-hoc sign the bundled tools
        working-directory: packaging/electron
        run: |
          find resources -type f \( -name 'analyzer' -o -name 'ffmpeg' -o -name 'ffprobe' -o -name '*.dylib' -o -name '*.so' \) -exec codesign --force --sign - {} \;

      - name: Generate the macOS icon
        working-directory: packaging/electron
        run: ./make-icns.sh

      - name: Build the DMG and ZIP
        working-directory: packaging/electron
        run: pnpm exec electron-builder --mac dmg zip --publish never

      - name: Smoke-test the packaged app
        shell: bash
        env:
          CHORDIFREE_SMOKE_LOG: ${{ github.workspace }}/desktop-smoke.log
          CHORDIFREE_SMOKE_FIXTURE: ${{ github.workspace }}/scripts/fixtures/chords.wav
        run: |
          APP=$(find packaging/electron/release -maxdepth 3 -name 'Chordifree.app' | head -1)
          "$APP/Contents/MacOS/Chordifree" --smoke-test

      - name: Upload the desktop smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-smoke-log
          path: desktop-smoke.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            packaging/electron/release/*.dmg
            packaging/electron/release/*.zip
          if-no-files-found: error

  linux-installer:
    name: Build the Linux installer
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the analyzer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/analyzer/requirements.txt pyinstaller

      - name: Download ONNX models
        shell: bash
        run: |
          mkdir -p services/analyzer/models
          curl -fsSL 'https://huggingface.co/jafet21/yamnetonnx/resolve/337f563004630f00673d4a773a0d657d0233ce56/yamnet.onnx' \
            -o services/analyzer/models/yamnet.onnx
          curl -fsSL 'https://essentia.upf.edu/models/classification-heads/voice_instrumental/voice_instrumental-audioset-yamnet-1.onnx' \
            -o services/analyzer/models/voice_instrumental.onnx
          echo '04e27fca08e7a3aea2630d1a63a51e6b437c803e0ff6e26399f80870ac251dda  services/analyzer/models/yamnet.onnx' | sha256sum -c -
          echo 'f619b35a95a44d8c3ec27a205d4c93ec988401fca443ff552ed007b3f1c018a0  services/analyzer/models/voice_instrumental.onnx' | sha256sum -c -

      - name: Build the analyzer sidecar
        run: pyinstaller packaging/analyzer/analyzer.spec --noconfirm

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --filter @chordifree/web build

      - name: Install desktop dependencies
        working-directory: packaging/electron
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: Bundle the server and stage the resources
        working-directory: packaging/electron
        run: |
          pnpm build:server
          pnpm resources

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot xvfb

      - name: Build the AppImage and deb
        working-directory: packaging/electron
        run: pnpm exec electron-builder --linux AppImage deb --publish never

      - name: Smoke-test the packaged app
        shell: bash
        env:
          CHORDIFREE_SMOKE_LOG: ${{ github.workspace }}/desktop-smoke.log
          CHORDIFREE_SMOKE_FIXTURE: ${{ github.workspace }}/scripts/fixtures/chords.wav
        run: |
          xvfb-run -a packaging/electron/release/linux-unpacked/chordifree --no-sandbox --smoke-test

      - name: Upload the desktop smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chordifree-linux-x64-smoke-log
          path: desktop-smoke.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: chordifree-linux-x64
          path: |
            packaging/electron/release/*.AppImage
            packaging/electron/release/*.deb
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [windows-installer, macos-installer, linux-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: chordifree-windows-installer
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: chordifree-macos-arm64
          path: artifacts/mac-arm64

      - uses: actions/download-artifact@v4
        with:
          name: chordifree-macos-x64
          path: artifacts/mac-x64

      - uses: actions/download-artifact@v4
        with:
          name: chordifree-linux-x64
          path: artifacts/linux

      - name: Collect the installers and publish checksums
        run: |
          mkdir -p release
          find artifacts -maxdepth 2 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Check the tag matches the desktop version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./packaging/electron/package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match v$version" >&2
            exit 1
          fi

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" \
              --title "Chordifree $TAG" \
              --notes-file docs/RELEASE_NOTES.md \
              release/*
          fi
